<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>

<body>
    <div class="card-container">
        <h1>Sign Up</h1>

        <form id="registerForm" method="POST" class="register-form" onsubmit="return validatePasswords()">

            <div class="input-group id-field">
                <label for="id">ID NUMBER</label>
                <input type="text" id="id" name="id" placeholder="Enter Student ID" required>
            </div>

            <div class="input-group name-field">
                <label for="name">FULL NAME</label>
                <input type="text" id="name" name="name" placeholder="Enter Full Name" required>
            </div>

            <div class="input-group email-field">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" placeholder="Enter Email Address" required>
            </div>

            <div class="input-group password-field">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="input-group confirm-field">
                <label for="confirm_password">REPEAT PASSWORD</label>
                <input type="password" id="confirm_password" placeholder="Repeat Password" required>
            </div>

            <p id="error-msg" class="error-text" style="display: none;"></p>

            <button type="submit" class="submit-btn">Register</button>
        </form>

        <p class="footer-text">Have an account? <a href="/login">Login here</a></p>
    </div>

<script>
function validatePasswords() {
    const pass = document.getElementById('password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const errorMsg = document.getElementById('error-msg');

    if (pass !== confirmPass) {
        errorMsg.innerText = "❌ Passwords do not match!";
        errorMsg.style.display = "block";
        return false;
    }

    errorMsg.style.display = "none";
    return true;
}
</script>
</body>
</html>
