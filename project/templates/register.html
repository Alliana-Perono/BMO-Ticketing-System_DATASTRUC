<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>

<body>
<div class="container">
    <h1>Registration</h1>
    <form id="registerForm" method="POST" onsubmit="return validatePasswords()">
        <input type="text" name="id" placeholder="Student ID" required>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="password" id="confirm_password" placeholder="Repeat Password" required>

        <p id="error-msg" style="color: #dc3545; font-size: 14px; display: none; margin: 5px 0;"></p>

        <button type="submit">Register</button>
    </form>
    <h3>Have an account? <a href="login">Log in here</a></h3>
</div>

#JAVASCRIPT
<script>
function validatePasswords() {
    const pass = document.getElementById('password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const errorMsg = document.getElementById('error-msg');

    if (pass !== confirmPass) {
        errorMsg.innerText = "❌ Passwords do not match!";
        errorMsg.style.display = "block";
        return false; // Blocks form submission
    }

    errorMsg.style.display = "none";
    return true; // Allows form submission
}
</script>
</body>
</html>
